[package]
name = "kivact-ui-game-catalog"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive styled component catalog for kivact-ui-game"

[features]
default = ["gpu", "complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../crates/kivact", default-features = false }
kivact-ui-game = { path = "../../crates/kivact-ui-game" }

[dev-dependencies]
kivact = { path = "../../crates/kivact", default-features = false, features = ["test"] }

[lints]
workspace = true
