[package]
name = "kivact-ui-basic-catalog"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Document-style component catalog for kivact-ui-basic"

[features]
default = ["gpu", "complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../crates/kivact", default-features = false }
kivact-ui-basic = { path = "../../crates/kivact-ui-basic" }

[dev-dependencies]
kivact = { path = "../../crates/kivact", default-features = false, features = ["test"] }

[lints]
workspace = true
