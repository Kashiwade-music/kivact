[package]
name = "kivact-ui-soft-catalog"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Astryx Neutral component catalog for kivact-ui-soft"

[features]
default = ["gpu", "complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../crates/kivact", default-features = false }
kivact-ui-soft = { path = "../../crates/kivact-ui-soft" }
catalog-shell = { path = "../catalog-shell" }

[dev-dependencies]
kivact = { path = "../../crates/kivact", default-features = false, features = ["test"] }
catalog-shell = { path = "../catalog-shell", features = ["test"] }

[lints]
workspace = true
