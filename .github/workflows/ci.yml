# Repository rules only. `cargo xtask check` includes the Google style checks,
# which run rustfmt and the selected Clippy lints over the workspace. The full
# gate in CONTRIBUTING.md (clippy -D warnings, tests, the window-opening suites
# and the architecture diagrams) runs locally before merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A cold style check compiles the whole workspace for Clippy.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      # Cache target/ too: the style checks' Clippy build is most of the run.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # xtask resolves features with --offline, so the registry must be filled first.
      - run: cargo fetch --locked
      # --no-write checks every rule and the diagram structure without
      # rendering SVGs (no Node); the diagrams are regenerated locally.
      - run: cargo xtask check --no-write
