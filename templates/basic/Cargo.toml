# Minimal Kivact app authored directly from public primitives.
[package]
name = "kivact-template-basic"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["gpu"]
# Applications choose the renderer; component libraries leave it to their consumer.
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../crates/kivact", default-features = false }

[dev-dependencies]
kivact = { path = "../../crates/kivact", default-features = false, features = ["test"] }

[lints]
workspace = true

# Standalone apps keep the engine and renderer responsive in debug builds.

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.vello_common]
opt-level = 3

[profile.dev.package.vello_hybrid]
opt-level = 3

