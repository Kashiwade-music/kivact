# Test code may unwrap and print; library code may not (workspace.lints.clippy).
allow-unwrap-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

too-many-lines-threshold = 80
disallowed-types = [
    { path = "std::cell::OnceCell", reason = "initialize values in constructors; static and kivact-types::cell use explicit expect" },
    { path = "std::sync::OnceLock", reason = "initialize values in constructors; static and kivact-types::cell use explicit expect" },
    { path = "std::cell::LazyCell", reason = "initialize values in constructors; static and kivact-types::cell use explicit expect" },
    { path = "std::sync::LazyLock", reason = "initialize values in constructors; static and kivact-types::cell use explicit expect" },
]
