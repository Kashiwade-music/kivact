[package]
name = "arvane-text"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arvane text adapter over parley"

[features]
# ICU's word and line dictionaries for scripts without spaces (Thai, Lao,
# Khmer, Myanmar, and Chinese/Japanese words); about 3 MB. The facade
# `kivact` enables it by default.
complex-scripts = ["parley/complex-scripts"]

[dependencies]
# Its `Equivalent` lets a cache lookup pass a borrowed text key, so only a
# miss builds (and allocates) one.
hashbrown = "0.17"
kivact-types = { path = "../kivact-types", version = "0.1.0" }
parley = { workspace = true }

# Linux finds system fonts through fontconfig. Loading libfontconfig at run
# time instead of linking it means a build needs no fontconfig development
# package (pkg-config, fontconfig.pc); feature unification turns this on for
# the fontique that parley uses.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { workspace = true }

[lints]
workspace = true
