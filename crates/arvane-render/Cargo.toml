[package]
name = "arvane-render"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arvane render adapter over vello_cpu and vello_hybrid"

[dependencies]
kivact-types = { path = "../kivact-types", version = "0.1.0" }
vello_cpu = { workspace = true }
# The glyph settings type vello_cpu takes but does not re-export (the
# version vello_cpu uses).
glifo = { version = "0.3.0", default-features = false }
# The filter types (blur) vello_cpu takes but does not re-export, and the
# texture rectangle type vello_hybrid takes (the version both use).
vello_common = { workspace = true }
skrifa = { workspace = true, default-features = true }
# The GPU renderer: vello_cpu's sparse strips, drawn by ordinary render
# pipelines (the vello_common and glifo versions vello_cpu uses).
vello_hybrid = { workspace = true, optional = true }
# The version vello_hybrid uses, with the platforms' primary backends.
wgpu = { workspace = true, optional = true }

[features]
gpu = ["dep:vello_hybrid", "dep:wgpu"]

[lints]
workspace = true
