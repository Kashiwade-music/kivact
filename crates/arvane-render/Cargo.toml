[package]
name = "arvane-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Arvane render adapter over vello_cpu and vello_hybrid"

[dependencies]
ui-types = { path = "../ui-types" }
vello_cpu = { workspace = true }
# The glyph settings type vello_cpu takes but does not re-export (the
# version vello_cpu uses).
glifo = { version = "0.3.0", default-features = false }
# The filter types (blur, drop shadow) vello_cpu takes but does not
# re-export, and the texture rectangle type vello_hybrid takes (the version
# both use).
vello_common = { workspace = true }
skrifa = { workspace = true, default-features = true }
# Views the softbuffer pixels as the bytes the CPU rasterizer writes.
bytemuck = "1.25.2"
# The GPU renderer: vello_cpu's sparse strips, drawn by ordinary render
# pipelines (the vello_common and glifo versions vello_cpu uses).
vello_hybrid = { workspace = true, optional = true }
# The version vello_hybrid uses, with the platforms' primary backends.
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
# The window a GPU surface presents to (the version winit's rwh_06 uses).
raw-window-handle = { workspace = true, optional = true }
# GPU texture sharing (feature `gpu-interop`): Arvane's unsafe GPU code
# lives in this crate, not here.
gpu-share = { path = "../gpu-share", optional = true, features = ["import"] }

[features]
gpu = ["dep:vello_hybrid", "dep:wgpu", "dep:pollster", "dep:raw-window-handle"]
# Drawing textures an application's render engine shares
# (`DrawCommand::External`): Direct3D 12 and Vulkan on Windows, Vulkan on
# Linux; elsewhere nothing is imported.
gpu-interop = ["gpu", "dep:gpu-share"]

[lints]
workspace = true
