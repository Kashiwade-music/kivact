[package]
name = "kivact"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Setup-once fine-grained reactive UI (Solid-style, no macros) over a retained native host"

[dependencies]
# Enable implementation features; the facade never calls these crates.
arvane-render = { path = "../arvane-render", version = "0.1.0", optional = true }
arvane-native = { path = "../arvane-native", version = "0.1.0", optional = true }
kivact-core = { path = "../kivact-core", version = "0.1.0", default-features = false }
kivact-interaction = { path = "../kivact-interaction", version = "0.1.0" }
kivact-ui = { path = "../kivact-ui", version = "0.1.0" }

kivact-test = { path = "../kivact-test", version = "0.1.0", optional = true }

[features]
tokio = ["kivact-core/tokio"]
default = ["gpu"]
gpu = ["dep:arvane-render", "arvane-render/gpu"]
gpu-interop = ["gpu", "kivact-core/gpu-interop", "kivact-test?/gpu-interop"]
embed = ["dep:arvane-native", "arvane-native/embed", "kivact-core/embed", "kivact-test?/embed"]
test = ["dep:kivact-test"]

[lints]
workspace = true
