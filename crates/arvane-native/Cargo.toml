[package]
name = "arvane-native"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arvane native backend: windows, input, presentation and native accessibility"

[dependencies]
arvane-shell = { path = "../arvane-shell", version = "0.1.0" }
kivact-types = { path = "../kivact-types", version = "0.1.0" }
winit = { workspace = true }
softbuffer = "0.4.8"
raw-window-handle = "0.6"
tracing = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
rfd = "=0.17.2"
sys-locale = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
accesskit_unix = "=0.22.1"
xim = { version = "=0.5.0", features = ["x11rb-client", "x11rb-xcb"] }
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "dl-libxcb", "randr", "xkb"] }
zbus = { workspace = true }
xkbcommon-dl = { version = "0.4.2", features = ["x11"] }
rustix = { version = "1", features = ["event", "time", "fs"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "=0.33.1"
# The version winit uses; the window subclass answering the IME's requests
# and telling pens and canceled contacts from touches.
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Storage_Xps", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_Graphics_Dwm"] }

[features]
embed = []
default = []
# Real windows for tests on one process-wide UI thread (`mirror`).
test = ["embed"]

[lints]
workspace = true





[[test]]
name = "smoke"
harness = false
required-features = ["test"]
