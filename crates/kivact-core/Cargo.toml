[package]
name = "kivact-core"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core view, control, reactive and platform contracts for Kivact"

[dependencies]
kivact-types = { path = "../kivact-types", version = "0.1.0" }
kivact-editing = { path = "../kivact-editing", version = "0.1.0" }
# The engine: the retained tree, layout, input, painting and accessibility
# in Arvane windows.
kivact-engine = { path = "../kivact-engine", version = "0.1.0" }
kivact-runtime = { path = "../kivact-runtime", version = "0.1.0" }
kivact-i18n = { path = "../kivact-i18n", version = "0.1.0" }
kivact-style = { path = "../kivact-style", version = "0.1.0" }
# The DevTools agent and its wire types (feature `devtools`).
kivact-devtools-agent = { path = "../kivact-devtools-agent", version = "0.1.0", optional = true }
kivact-devtools-protocol = { path = "../kivact-devtools-protocol", version = "0.1.0", optional = true }
# The `kivact` and `kivact::layout` tracing targets of the host side.
tracing = { workspace = true }
# PNG encoding of the images an SVG export embeds (`draw::Svg`).
png = { workspace = true }

[features]
tokio = ["kivact-runtime/tokio"]
embed = []
gpu-interop = []
devtools = ["dep:kivact-devtools-agent", "dep:kivact-devtools-protocol"]

[lints]
workspace = true
