[package]
name = "kivact-core"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core view, control, reactive and platform contracts for Kivact"

[dependencies]
kivact-types = { path = "../kivact-types", version = "0.1.0" }
kivact-editing = { path = "../kivact-editing", version = "0.1.0" }
# The engine: the retained tree, layout, input, painting and accessibility
# in Arvane windows.
kivact-engine = { path = "../kivact-engine", version = "0.1.0" }
kivact-runtime = { path = "../kivact-runtime", version = "0.1.0" }
kivact-i18n = { path = "../kivact-i18n", version = "0.1.0" }
kivact-style = { path = "../kivact-style", version = "0.1.0" }
# The `kivact` and `kivact::layout` tracing targets of the host side.
tracing = { workspace = true }

[features]
embed = ["kivact-engine/embed"]
default = ["gpu"]
# The GPU renderer (wgpu + vello_hybrid): windows draw on the GPU, and on the
# CPU when no GPU can (ARVANE_RENDERER=cpu forces the CPU). Without it every
# window draws on the CPU and wgpu stays out of the build.
gpu = ["kivact-engine/gpu"]
# Experimental: draw textures an application's own render engine shares with
# the window, without reading them back (`gpu_interop`). Windows (Direct3D 12,
# Vulkan) and Linux (Vulkan); elsewhere nothing can be imported.
gpu-interop = ["kivact-style/gpu-interop", "gpu", "kivact-engine/gpu-interop"]
# Testing Library over real Arvane windows (kivact::test).
test = ["kivact-engine/testing"]

[lints]
workspace = true
