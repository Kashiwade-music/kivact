[package]
name = "kivact-devtools"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Kivact DevTools app."

[features]
default = ["gpu", "complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../kivact", version = "0.1.0", default-features = false }
kivact-devtools-protocol = { path = "../kivact-devtools-protocol", version = "0.1.0", features = ["client"] }
serde_json = { workspace = true }

[dev-dependencies]
kivact = { path = "../kivact", version = "0.1.0", default-features = false, features = ["test"] }

[lints]
workspace = true
