[package]
name = "kivact-engine"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kivact internal engine: retained UI state, interaction, scene generation and the Arvane window bridge"

[dependencies]
arvane-virtual = { path = "../arvane-virtual", version = "0.1.0", optional = true }
arvane-native = { path = "../arvane-native", version = "0.1.0" }
unicode-segmentation.workspace = true
kivact-layout = { path = "../kivact-layout", version = "0.1.0" }
kivact-editing = { path = "../kivact-editing", version = "0.1.0" }
kivact-types = { path = "../kivact-types", version = "0.1.0" }
arvane = { path = "../arvane", version = "0.1.0" }
# Screenshots of the test driver (feature `testing`).
png = { workspace = true, optional = true }

[lib]
doctest = false

[features]
testing = ["dep:arvane-virtual", "arvane-virtual/mirror", "dep:png", "arvane-native/test"]

[[test]]
name = "host_locale"
required-features = ["testing"]

[lints]
workspace = true
