[package]
name = "kivact-engine"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kivact internal engine: retained UI state, interaction, scene generation and the Arvane window bridge"

[dependencies]
unicode-segmentation.workspace = true
kivact-layout = { path = "../kivact-layout", version = "0.1.0" }
kivact-editing = { path = "../kivact-editing", version = "0.1.0" }
kivact-types = { path = "../kivact-types", version = "0.1.0" }
arvane = { path = "../arvane", version = "0.1.0" }
# Screenshots of the test driver (feature `testing`).
png = { workspace = true, optional = true }

[lib]
doctest = false

[features]
embed = ["arvane/embed"]
default = []
# The GPU renderer (kivact's default `gpu` feature turns it on).
gpu = ["arvane/gpu"]
# Drawing textures an application's render engine shares (experimental;
# kivact's `gpu-interop` turns it on): the writes that import and drop them,
# the scene's external frames and the adapter the window reports.
gpu-interop = ["gpu", "arvane/gpu-interop"]
# The in-process test driver on real windows (`testing`).
testing = ["arvane/testing", "dep:png"]

[[test]]
name = "host_locale"
required-features = ["testing"]

[lints]
workspace = true
