[package]
name = "kivact-style"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kivact internal crate: styles, themes, tokens and the drawing vocabulary (use the `kivact` facade)"

[dependencies]
kivact-editing = { path = "../kivact-editing", version = "0.1.0" }
kivact-shader = { path = "../kivact-shader", version = "0.1.0" }
kivact-runtime = { path = "../kivact-runtime", version = "0.1.0" }
kivact-types = { path = "../kivact-types", version = "0.1.0" }
# Curve geometry behind `Path` (bounds, length, trim, stroke outline); the same
# version Arvane's rasterizer uses through vello. kurbo types are never public.
kurbo = { workspace = true }
# SVG path grammar and normalization stay private to Path.
svgtypes = "=0.16.1"

[dev-dependencies]
# Doctests show what users write (`use kivact::prelude::*`). Dev-dependency
# cycles are allowed by Cargo; nothing but the doctests uses the facade.
kivact = { path = "../kivact", features = ["gpu-interop"] }

[lints]
workspace = true
