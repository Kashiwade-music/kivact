[package]
name = "kivact-i18n"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kivact internal crate: locale and messages (use the `kivact` facade)"

[dependencies]
icu_decimal = "2.4.0"
icu_provider = "2.4.0"
icu_datetime = { version = "2.4.0", features = ["unstable"] }
icu_calendar = "2.4.0"
icu_locale_core = "2.4.0"
icu_plurals = "2.4.0"
icu_collator = "2.4.0"
writeable = "0.6"
kivact-runtime = { path = "../kivact-runtime", version = "0.1.0" }

[dev-dependencies]
# Doctests show what users write (`use kivact::prelude::*`). Dev-dependency
# cycles are allowed by Cargo; nothing but the doctests uses the facade.
kivact = { path = "../kivact" }

[lints]
workspace = true
