[package]
name = "arvane"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arvane: the window, text, rendering, accessibility and asset layer behind kivact-engine (public facade)"

[dependencies]
arvane-shell = { path = "../arvane-shell", version = "0.1.0" }
kivact-types = { path = "../kivact-types", version = "0.1.0" }
arvane-text = { path = "../arvane-text", version = "0.1.0" }
arvane-render = { path = "../arvane-render", version = "0.1.0" }
arvane-asset = { path = "../arvane-asset", version = "0.1.0" }
tracing = "0.1.41"

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
gpu-interop-producer = { path = "../../dev/tests/gpu-interop-producer", features = ["wgpu"] }

# Arvane's contract tests: the arvane facade alone, on real test windows
# (one binary, to link once).
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[dev-dependencies]
# The GPU and shared-texture contract tests run with `cargo test -p arvane` alone.
arvane-render = { path = "../arvane-render", features = ["gpu"] }
arvane-native = { path = "../arvane-native", features = ["test"] }
arvane-virtual = { path = "../arvane-virtual", features = ["mirror"] }

[lints]
workspace = true
