[package]
name = "arvane-asset"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arvane assets: image loading, format detection, raster and SVG decoding, tint, fit, the image cache and worker, font files"

[dependencies]
tracing = { workspace = true }
kivact-types = { path = "../kivact-types", version = "0.1.0" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# `text` turns SVG `<text>` into paths with the fonts arvane-text finds (no
# system font database of its own); `raster-images` draws data URL images.
resvg = { version = "0.46.0", default-features = false, features = ["text", "raster-images"] }
arvane-text = { path = "../arvane-text", version = "0.1.0" }
# SVGZ is decompressed here, within a limit, before usvg sees it (usvg's
# own decompression reads to the end). The version and backend usvg uses.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
skrifa = { workspace = true, features = ["std"] }

[lib]
doctest = false

[lints]
workspace = true
