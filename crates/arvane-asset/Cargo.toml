[package]
name = "arvane-asset"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arvane assets: image loading, format detection, raster and SVG decoding, tint, fit, the image cache and worker, font files"

[dependencies]
tracing = { workspace = true }
kivact-types = { path = "../kivact-types", version = "0.1.0" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# `text` shapes SVG `<text>` with the store's font database (`system-fonts`
# loads the system fonts into it); `raster-images` draws the PNG, JPEG, GIF
# and WebP data URLs inside an SVG.
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# SVGZ is decompressed here, within a limit, before usvg sees it (usvg's
# own decompression reads to the end). The version and backend usvg uses.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
skrifa = { workspace = true, features = ["std"] }

[lib]
doctest = false

[lints]
workspace = true
