[package]
name = "kivact-ext-apps"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Two small apps (log viewer, device status monitor) built only on the Kivact public API and kivact-external-component"

[features]
default = ["gpu"]
# Applications choose the renderer; component libraries leave it to their consumer.
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../../crates/kivact", default-features = false }
kivact-external-component = { path = "../../tests/fixtures/external-component" }

[dev-dependencies]
kivact = { path = "../../../crates/kivact", default-features = false, features = ["test"] }

[[bin]]
name = "log-viewer"
path = "src/bin/log_viewer.rs"

[[bin]]
name = "device-monitor"
path = "src/bin/device_monitor.rs"

[lints]
workspace = true
