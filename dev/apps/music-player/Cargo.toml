[package]
name = "kivact-music-player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["gpu"]
# Applications choose the renderer; component libraries leave it to their consumer.
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../../crates/kivact", default-features = false }
rodio = { version = "0.20.1", default-features = false }

[dev-dependencies]
kivact = { path = "../../../crates/kivact", default-features = false, features = ["test"] }

[[bin]]
name = "music-player"
path = "src/main.rs"

[lints]
workspace = true
