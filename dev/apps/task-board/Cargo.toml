[package]
name = "kivact-example-task-board"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["gpu"]
# Applications choose the renderer; component libraries leave it to their consumer.
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../../crates/kivact", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
kivact = { path = "../../../crates/kivact", default-features = false, features = ["test"] }

[[bin]]
name = "task-board"
path = "src/main.rs"

[lints]
workspace = true
