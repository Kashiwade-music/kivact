[package]
name = "kivact-text-primitives-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# An independent consumer cannot inherit implementation dependencies.
[workspace]

[features]
default = ["gpu"]
gpu = ["kivact/gpu"]

[dependencies]
kivact = { path = "../../../../crates/kivact", default-features = false }

[dev-dependencies]
kivact = { path = "../../../../crates/kivact", default-features = false, features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

# Native editor operations remain optimized across this independent boundary.
[profile.dev.package.kivact-editing]
opt-level = 3

# Keep shared protocol calculations optimized across this independent boundary.
[profile.dev.package.kivact-wire]
opt-level = 3

# Optimize value lowering across this independent consumer boundary.
[profile.dev.package.kivact-lower]
opt-level = 3

# Keep retained text operations optimized at this independent boundary.
[profile.dev.package.kivact-text]
opt-level = 3

# Optimize engine integration and layout computation in this independent build.
[profile.dev.package.kivact-engine]
opt-level = 3

# Optimize engine integration and layout computation in this independent build.
[profile.dev.package.kivact-layout]
opt-level = 3
