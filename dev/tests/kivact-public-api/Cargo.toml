[package]
name = "kivact-public-api-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false
description = "Public Kivact API consumer tests: one real-window E2E binary, the windowless Offscreen tests and compile-time API checks"

[features]
embed = ["kivact/embed"]
default = ["gpu"]
# The consumer selects the renderer independently of the testing API.
gpu = ["kivact/gpu"]
# GPU texture sharing (`kivact::gpu_interop`, tests/e2e/gpu_interop.rs).
gpu-interop = ["gpu", "kivact/gpu-interop"]

[dev-dependencies]
async-channel = { workspace = true }
kivact = { path = "../../../crates/kivact", default-features = false, features = ["test"] }
# The standard components are drawn like a kit's own once the kit's theme is
# installed (tests/e2e/ui_standard.rs).
kivact-ui-basic = { path = "../../../crates/kivact-ui-basic" }
kivact-ui-game = { path = "../../../crates/kivact-ui-game" }
kivact-ui-pop = { path = "../../../crates/kivact-ui-pop" }
kivact-ui-creative = { path = "../../../crates/kivact-ui-creative" }
trybuild = "1.0.121"
# The integration tests observe the trace through a subscriber.
tracing = { workspace = true }

# The render engine standing in for an application's in the GPU texture
# sharing tests (tests/e2e/gpu_interop.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
gpu-interop-producer = { path = "../gpu-interop-producer", features = ["wgpu"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[[test]]
name = "embed_resources"
path = "tests/embed_resources.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "offscreen"
path = "tests/offscreen.rs"

[[test]]
name = "compile"
path = "tests/compile.rs"

[lints]
workspace = true
