[package]
name = "kivact-public-api-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false
description = "Public Kivact API consumer tests: E2E binaries e2e_core, e2e_ui and e2e_native, and the windowless Offscreen tests"

[features]
# Starts the DevTools agent of the test App (tests/e2e_native/devtools.rs).
devtools = ["kivact/devtools"]
embed = ["kivact/embed"]
default = ["gpu", "complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
tokio = ["kivact/tokio"]
# The consumer selects the renderer independently of the testing API.
gpu = ["kivact/gpu"]
# GPU texture sharing (`kivact::gpu_interop`, tests/e2e_native/gpu_interop.rs).
gpu-interop = ["gpu", "kivact/gpu-interop"]

# The E2E helpers (`support`, `paint`) that the test binaries share.
[dependencies]
kivact = { path = "../../../crates/kivact", default-features = false, features = ["test"] }

[dev-dependencies]
async-channel = { workspace = true }
kivact-devtools-protocol = { path = "../../../crates/kivact-devtools-protocol", features = ["client"] }
# Encodes the GIF, APNG and WebP fixtures of the image tests
# (tests/e2e_core/images_animated.rs).
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp"] }

# The render engine standing in for an application's in the GPU texture
# sharing tests (tests/e2e_native/gpu_interop.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
gpu-interop-producer = { path = "../gpu-interop-producer", features = ["wgpu"] }
# The consumer of a drawable's export on its own thread (tests/e2e_native/
# drawable_export_gpu.rs): a device on the window's adapter and
# `Import`, which the consumer names through wgpu.
kivact-gpu-share = { path = "../../../crates/kivact-gpu-share", features = ["import", "wgpu"] }
wgpu = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[[test]]
name = "e2e_core"
path = "tests/e2e_core/main.rs"

[[test]]
name = "e2e_ui"
path = "tests/e2e_ui/main.rs"

[[test]]
name = "e2e_native"
path = "tests/e2e_native/main.rs"

[[test]]
name = "foreign_window_run"
path = "tests/foreign_window_run.rs"
harness = false
required-features = ["embed"]

[[test]]
name = "offscreen"
path = "tests/offscreen.rs"

[lints]
workspace = true
