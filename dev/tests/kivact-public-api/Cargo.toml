[package]
name = "kivact-public-api-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false
description = "Public Kivact API consumer tests: one real-window E2E binary and the windowless Offscreen tests"

[features]
# Starts the DevTools agent of the test App (tests/e2e/devtools.rs).
devtools = ["kivact/devtools"]
embed = ["kivact/embed"]
default = ["gpu", "complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
tokio = ["kivact/tokio"]
# The consumer selects the renderer independently of the testing API.
gpu = ["kivact/gpu"]
# GPU texture sharing (`kivact::gpu_interop`, tests/e2e/gpu_interop.rs).
gpu-interop = ["gpu", "kivact/gpu-interop"]

[dev-dependencies]
async-channel = { workspace = true }
kivact = { path = "../../../crates/kivact", default-features = false, features = ["test"] }
kivact-devtools-client = { path = "../../../crates/kivact-devtools-client" }
kivact-devtools-protocol = { path = "../../../crates/kivact-devtools-protocol" }
# Encodes the GIF, APNG and WebP fixtures of the image tests
# (tests/e2e/images_animated.rs).
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp"] }
# The standard components are drawn like a kit's own once the kit's theme is
# installed (tests/e2e/ui_standard.rs).
kivact-ui-basic = { path = "../../../crates/kivact-ui-basic" }
kivact-ui-game = { path = "../../../crates/kivact-ui-game" }
kivact-ui-pop = { path = "../../../crates/kivact-ui-pop" }
kivact-ui-creative = { path = "../../../crates/kivact-ui-creative" }
kivact-ui-soft = { path = "../../../crates/kivact-ui-soft" }

# The render engine standing in for an application's in the GPU texture
# sharing tests (tests/e2e/gpu_interop.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
gpu-interop-producer = { path = "../gpu-interop-producer", features = ["wgpu"] }
# The consumer of a drawable's export on its own thread (tests/e2e/
# drawable_export_gpu.rs): a device on the window's adapter and
# `Import`, which the consumer names through wgpu.
kivact-gpu-share = { path = "../../../crates/kivact-gpu-share", features = ["import", "wgpu"] }
wgpu = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "offscreen"
path = "tests/offscreen.rs"

[lints]
workspace = true
