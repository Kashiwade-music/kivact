[package]
name = "kivact-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Compile checks for docs/: every ```rust block of the guides runs as a doctest"

[features]
default = ["gpu", "complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
# Applications choose the renderer; component libraries leave it to their consumer.
gpu = ["kivact/gpu"]
# The GPU texture sharing guide compiles only with it (its blocks use both sides).
gpu-interop = ["gpu", "kivact/gpu-interop", "dep:kivact-gpu-share", "dep:wgpu"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = { workspace = true }
async-channel = { workspace = true }
kivact = { path = "../../../crates/kivact", default-features = false, features = ["test", "embed", "tokio"] }
kivact-ui-basic = { path = "../../../crates/kivact-ui-basic" }
kivact-ui-pop = { path = "../../../crates/kivact-ui-pop" }
kivact-ui-creative = { path = "../../../crates/kivact-ui-creative" }
kivact-ui-game = { path = "../../../crates/kivact-ui-game" }
kivact-ui-soft = { path = "../../../crates/kivact-ui-soft" }
kivact-gpu-share = { path = "../../../crates/kivact-gpu-share", features = ["wgpu"], optional = true }
wgpu = { workspace = true, optional = true }

[lints]
workspace = true
