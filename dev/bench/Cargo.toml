[package]
name = "kivact-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Manual KPI probes (startup, memory, CPU, frame time, update latency) for the slim-fast refactor; never run by CI"

[features]
# The App configurations K1/K6 compare.
default = ["complex-scripts"]
complex-scripts = ["kivact/complex-scripts"]
# `kv_latency` drives the test driver.
latency = ["kivact/test"]

[dependencies]
kivact = { path = "../../crates/kivact", default-features = false, features = ["gpu"] }
# Resolves allocation sites for `kv_heap` (build it with line tables, see README).
backtrace = "=0.3.76"

[[bin]]
name = "kv_latency"
required-features = ["latency"]

[lints]
workspace = true
