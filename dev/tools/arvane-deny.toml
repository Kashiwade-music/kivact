# Audit the Arvane graph with --manifest-path crates/arvane/Cargo.toml.
[graph]
all-features = true

[advisories]
db-path = "target/arvane-advisory-db"
git-fetch-with-cli = true

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "BSL-1.0"]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Report upstream version duplication; distinct render/font generations coexist.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
