# `cargo xtask check`（xtask-core）が読む workspace の規則（CONTRIBUTING.md）。

output = "architecture"

[limits]
# 1ファイルの code 行の上限。空行・comment だけの行・文字列 literal の中だけの行は数えない。
max_code_lines = 1000

[diagrams]
targets = "lib-bin"

[visible_to]

# ----- Kivact の内部 crate: host を知らない反応の核は kivact-core だけが使う。アプリと部品は
# kivact facade だけに依存する。
kivact-runtime = ["kivact-style", "kivact-i18n", "kivact-core"]
kivact-i18n = ["kivact-core"]
kivact-style = ["kivact-core"]
kivact-core = ["kivact", "kivact-interaction", "kivact-ui"]
kivact-interaction = ["kivact", "kivact-ui"]
kivact-ui = ["kivact"]

# ----- Core/engine boundary: only kivact-core consumes the engine.
# App::run, OffscreenRenderer and the test driver share the engine API.
# Embedded handles are Send + Sync. A panic of an embedded App is kept in a
# PanicSlot and resumed by the embedder's next call; nothing turns it into a
# diagnostic.
# Detach facts use the single process-wide tracker in kivact-types.
# Only arvane-native retains the code module; task and asset contain no unsafe.
# Shared values belong to kivact-types; pure layout belongs to kivact-layout.
kivact-engine = ["kivact-core"]
kivact-editing = ["kivact-style", "kivact-engine", "kivact-core"]
kivact-layout = ["kivact-engine"]

# ----- Arvane: 窓口の arvane は engine と lower が使う。adapter 同士は
# arvane-shell の語彙と入力正規化、kivact-types の値を共有する。
arvane = ["kivact-engine"]
# GPU texture 共有の中立な kivact-gpu-share は UI を知らず、import と export の契約を共有する
# （visible_to は書かない。誰でも依存できる）。
arvane-shell = ["arvane", "arvane-native", "kivact-engine", "arvane-virtual"]
# Linux embedded native services own XCB/XIM, AT-SPI and desktop services;
# callbacks queue through arvane-shell and never depend back on the engine.
arvane-native = ["kivact-engine", "arvane-virtual", "arvane", "kivact"]
# Engine testing owns the stepped Script/Probe bridge; core uses its public test host.
arvane-virtual = ["kivact-engine", "arvane"]
arvane-text = ["arvane"]
arvane-render = ["arvane", "kivact"]
arvane-asset = ["arvane"]
# 試験だけの engine（自前の device で frame を描いて共有する）。Arvane の契約の試験と、公開 API の試験・
# creative kit の GPU frame の試験（dev-dependency）だけが使う。
gpu-interop-producer = ["arvane", "kivact-public-api-tests", "kivact-ui-creative"]

# ----- アプリ・例・雛形・ツール: 誰も依存しない。
kivact-template-basic = []
kivact-example-counter = []
kivact-example-form = []
kivact-example-list = []
kivact-example-async = []
kivact-example-component = []
kivact-ui-basic-catalog = []
kivact-ui-pop-catalog = []
kivact-ui-game-catalog = []
kivact-ui-creative-catalog = []
kivact-ui-soft-catalog = []
kivact-docs = []
# Public API tests consume all five official kits for theme conformance.
kivact-public-api-tests = []
xtask = []

# xtask-core は、外部 crate の glob import（`use kivact::prelude::*` など）がある module で、
# macro と derive の提供元を決められない。標準の macro と derive は glob で上書きされない前提で信頼する。
# 全 crate の循環と未解決 local path は error とし、移行中の警告扱いは設けない。
[analysis]
all_features = true
trusted_macros = [
    "assert", "assert_eq", "assert_ne", "cfg", "debug_assert", "debug_assert_eq",
    "debug_assert_ne", "eprintln", "format", "include_bytes", "include_str", "line",
    "concat", "matches", "panic", "println", "unreachable", "vec", "write", "writeln", "env", "file",
    "thread_local", "tracing::debug", "tracing::error", "tracing::info", "tracing::trace",
    "tracing::warn",
    # workspace の macro_rules と、それを呼ぶ path は dev/xtask（macros.rs）が自動で足す。
    # item を生成する macro は、呼んだ module を解析の外に置く。
]
trusted_derives = [
    "Clone", "Copy", "Debug", "Default", "Eq", "Hash", "Ord", "PartialEq", "PartialOrd",
    "Deserialize", "Serialize",
]

# ----- crate 内の module の依存の向き（dev/xtask の module_rules.rs）。依存の向き
# `kivact-runtime ◀ i18n ◀ style ◀ view, draw ◀ control ◀
# primitive ◀ prelude ◀ test` と `{task, motion, style, view} ◀ platform, diagnostics, gpu_interop ◀
# client ◀ prelude` を書く。`uses` の key の module（子孫を含む）は、自分の部分木、crate root、
# 値に挙げた module、`uses` に無い module だけを参照してよい。`except` は上向きの例外
# "from -> to"（`crate::` を省く。from はその module だけ、to はその module と子孫）。どの参照にも
# 使われない例外も error にする。
[module_rules.kivact-core.uses]
task = []
motion = []
style = []
view = ["task", "motion", "style"]
draw = ["task", "motion", "style"]
control = ["task", "motion", "style", "view"]
# env・service の要求・`why`・GPU の取り込みは、公開 module が実装を持つ（view の state と requests の上に立つ）。
platform = ["task", "motion", "style", "view"]
# Embedded App setup uses the same root client factory.
embed = ["view"]
diagnostics = ["task", "motion", "style", "view"]
# 実験 feature `gpu-interop`。per-App の状態は client が runtime の extension に入れる。
gpu_interop = ["task", "motion", "style", "view"]
client = ["task", "motion", "style", "view", "platform", "gpu_interop"]
primitive = ["task", "motion", "style", "view", "draw", "control"]
# 再公開だけの入口。中核の module からは参照させない（test だけが使う）。
prelude = [
    "task", "motion", "style", "view", "draw", "control", "platform",
    "diagnostics", "client", "primitive",
]
test = [
    "task", "motion", "style", "view", "draw", "control", "platform",
    "diagnostics", "gpu_interop", "client", "primitive", "prelude", "embed",
]

# kivact-i18n の module。`context` は locale と messages の値を読む。
[module_rules.kivact-i18n.uses]
date = ["locale"]
locale = []
messages = []
context = ["locale", "messages"]

[module_rules.kivact-runtime.uses]
machine = ["reactive", "task"]
host = ["reactive", "task", "motion"]
reactive = []
task = ["reactive"]
motion = ["reactive"]

# kivact-style の module。値（`asset`・`length`・`geometry`・`color`・`transform`・`path`・`grid`・`icon`）を
# 下に、それを使う `theme`・`effect`・`paint`・`text` をその上に、`Draw` の `draw`、`Style` の `sheet`、
# `Style` 全体の `resolve` をさらに上に置く。
[module_rules.kivact-style.uses]
asset = []
length = []
geometry = ["length"]
color = []
transform = ["geometry", "length"]
path = ["geometry", "transform"]
grid = ["length"]
icon = ["asset"]
theme = ["color", "icon"]
effect = ["color", "geometry", "length", "path", "theme"]
paint = ["asset", "color", "geometry", "length", "theme"]
text = ["color", "effect", "paint", "theme"]
draw = ["asset", "color", "effect", "geometry", "paint", "path", "text", "theme", "transform"]
sheet = ["color", "draw", "effect", "geometry", "grid", "length", "paint", "text", "theme", "transform"]
resolve = [
    "color", "draw", "effect", "geometry", "grid", "length", "paint", "sheet", "text", "theme",
    "transform",
]

# kivact-interaction は部品ごとに、組み合わせてよい下位の部品を書く。純粋な計算の `policy` と、
# `disclosure`・`list`・`drag`・`edit` などの部品の上に、`popup`・`menu`・`select`・`table`・
# `palette` を組む。表に無い部品を参照するときは、ここに足してから使う。
[module_rules.kivact-interaction.uses]
policy = []
axis = []
press = []
delayed = []
space_pan = []
disclosure = []
edit = []
focus_return = []
roving = []
drag = ["edit"]
list = ["axis", "roving"]
text_edit = []
toaster = []
toggle = []
popup = ["disclosure", "focus_return"]
scalar = ["axis", "drag", "edit", "focus_return", "policy"]
range_scalar = ["drag", "edit", "policy", "scalar"]
dialog = ["focus_return", "popup"]
tooltip = ["delayed", "popup"]
combobox = ["list"]
tabs = ["axis", "list"]
tree = ["list", "press"]
select = ["focus_return", "list", "popup"]
menu = ["delayed", "focus_return", "list", "popup"]
zoom_pan = ["edit", "space_pan"]
splitter = ["axis", "drag", "edit", "policy", "press", "scalar"]
table = ["axis", "list", "policy", "roving", "splitter"]
palette = ["combobox", "dialog", "list", "popup"]

# Portable shell vocabulary and input normalization never depend on a backend.
[module_rules.arvane-shell.uses]
pipeline = ["events", "types"]
a11y = ["events"]
types = []
events = []
clicks = ["events"]
contacts = ["events"]
mouse = []
ime = []
services = []
# The window SPI uses the neutral vocabulary and the GPU target leaf.
window = ["events", "ime", "types", "services", "a11y", "target"]
target = []


# B7: topology below measurement, Model processing, presentation,
# diagnostics and host. model::interact belongs to the Model processing tier.
[module_rules.kivact-engine]
except = [
    # Model owns passive state; these leaves import no Model or processing code.
    "model::aggregate -> paint::state",
    "model::aggregate -> a11y::state",
    "model::aggregate -> check::lint::state",
    # Sync derives Look values directly and calls PaintState's narrow invalidator.
    "model::interact::sync -> paint::state",
]
[module_rules.kivact-engine.uses]
lower = []
text_input = []
contract = []
tree = ["lower", "contract"]
mutation = ["contract", "tree"]
frame_log = ["contract"]
measure = ["text_input", "lower", "contract", "tree"]
model = ["text_input", "lower", "contract", "tree", "measure", "mutation"]
text_measure = ["lower", "contract", "tree", "measure", "model"]
paint = ["lower", "contract", "tree", "measure", "mutation", "model", "text_measure"]
a11y = ["contract", "tree", "measure", "mutation", "model"]
check = ["lower", "contract", "tree", "measure", "mutation", "model", "paint", "a11y"]
host = ["text_input", "contract", "tree", "measure", "mutation", "model", "paint", "a11y", "check", "text_measure", "frame_log"]
offscreen = ["lower", "contract", "text_measure"]
# The facade exposes the immutable WriteStats DTO from this passive leaf.
api = ["contract", "host", "offscreen", "text_measure", "mutation"]
embed = ["contract", "host", "api", "frame_log"]
testing = ["contract", "host", "offscreen", "api"]

# Shared values and render records depend only on the concept modules below.
# Closure-owning contracts stay in the engine; backend implementations stay outside types.
[module_rules.kivact-types.uses]
animatable = ["geometry"]
asset = []
cell = []
check = ["geometry", "ids", "semantics"]
color = []
defaults = ["geometry"]
embed = ["defaults", "geometry", "gpu"]
env = ["cell", "defaults", "geometry"]
geometry = []
gpu = []
ids = []
input = ["geometry"]
layout = ["geometry", "ids"]
motion = ["animatable", "geometry"]
paint = ["asset", "color", "geometry", "layout", "motion", "scene"]
platform = ["asset", "geometry"]
process = []
render = ["asset", "check", "color", "env", "geometry", "gpu", "ids", "input", "layout", "motion", "paint", "platform", "scene", "semantics", "semantics_text", "text", "text_shaping"]
scene = ["asset", "color", "geometry", "gpu", "ids", "paint", "render", "semantics", "text"]
semantics = ["geometry", "ids", "semantics_text"]
semantics_text = ["geometry", "ids"]
text = ["color", "geometry", "paint"]
text_shaping = ["render", "scene", "text"]
text_utf = []

[style]
enabled = true
extra_rules = [
    "glob-imports",
    "non-leaf-implementation",
    "rustfmt-skip",
    "catch-unwind",
    "poison-access",
    "options-default",
]
# 公開 API はまだ大きく変わるので、公開 item の rustdoc の有無（missing-docs）は今は検査しない。
# API が落ち着いたら外す。
disabled_rules = ["missing-docs"]
# non-exhaustive（extra_rules に入れていない）も同じ理由で今は検査しない。互換を残さない初期開発版では
# semver の利点がなく、workspace の中の match から網羅性の検査を奪うだけになる。API が落ち着いたら
# extra_rules に戻す。下の api_packages はそのときの対象。
# Shared vocabulary is defined in kivact-types concept modules; render records are internal transport.
# facade（kivact）から届く crate と、五つの公式キット。
api_packages = [
    "kivact", "kivact-core", "kivact-editing", "kivact-gpu-share", "kivact-i18n", "kivact-interaction",
    "kivact-runtime", "kivact-style", "kivact-types", "kivact-ui",
    "kivact-ui-basic", "kivact-ui-creative", "kivact-ui-game", "kivact-ui-pop", "kivact-ui-soft",
]
# 関数に渡す「option の束」。必須の値（親 window、texture の大きさ）は束に入れず引数で渡す。
options_structs = [
    "arvane-native::mirror::MirrorWindowOptions",
    "arvane-virtual::VirtualOptions",
    "arvane::ShellSetup",
    "arvane-shell::ChildHooks",
    "arvane-shell::ShellOptions",
    "kivact-core::test::RenderOptions",
    "kivact-engine::api::HostOptions",
    "kivact-engine::testing::TestHostOptions",
    "kivact-interaction::Delays",
    "kivact-interaction::Dismiss",
    "kivact-interaction::ListPolicy",
    "kivact-interaction::ListRangePolicy",
    "kivact-interaction::TooltipConfig",
    "kivact-style::draw::ImageOptions",
    "kivact-style::draw::TextStyle",
    "kivact-types::GpuPreference",
    "kivact-types::embed::EmbedOptions",
    "kivact-types::env::PointerSettings",
    "kivact-types::platform::FileDialog",
    "kivact-ui-basic::ChartConfig",
    "kivact-ui-creative::WindowOptions",
]

# kivact::prelude は意図した公開 API（利用者が `use kivact::prelude::*;` で始める）。
# 利用者の立場のコード（例・雛形・公開 API とキットの E2E）だけが prelude を glob で読む。
# これらの path でも prelude 以外の glob は書かない。
[[style.exceptions]]
rule = "glob-imports"
path = "examples/*"
reason = "Examples are written as Kivact users write apps: they start from `use kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "templates/*"
reason = "The app template starts from `use kivact::prelude::*`, as the guides teach."

[[style.exceptions]]
rule = "glob-imports"
path = "dev/tests/kivact-public-api/*"
reason = "Public API E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-basic/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-creative/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-game/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-pop/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact/src/prelude.rs"
reason = "The facade prelude is kivact_core's prelude plus the standard UI functions."

[[style.exceptions]]
rule = "catch-unwind"
path = "crates/arvane-native/src/port/win32/proc.rs"
item = "port::win32::proc::wndproc"
reason = "Defense in depth at a foreign frame: Win32 calls this subclassed window procedure from the embedding host's message loop, so a panic must not unwind into it. The payload is kept in the child's PanicSlot, the App stops without running more App code, and the host's next call on Embedded resumes it (resume_unwind); it is never swallowed."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-core/src/client/dispatch.rs"
item = "client::dispatch::dispatch"
reason = "Glue that ties the event modules together: it routes each HostEvent variant to the child module of its kind and implements no event handling itself."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-core/src/view/mount.rs"
item = "view::mount::mount_host_with"
reason = "Glue that ties the mounting stages together: it runs the child modules' stages in the one order mounting requires and implements none of them."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-core/src/view/mount.rs"
item = "view::mount::mount_host"
reason = "The stage sequence of mount_host_with without a layout fix-up; glue over the mounting stages."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/arvane-native/src/port/embed/open.rs"
item = "port::embed::open::open"
reason = "Glue: `open` only selects the Win32 or X11 child backend by cfg; other platforms report Unsupported."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "examples/kivact-ui-basic/src/docs.rs"
item = "docs::PAGES"
reason = "Glue: the page registry only lists each child page module's `page()` in navigation order."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "dev/xtask/src/main.rs"
item = "main"
reason = "Glue: the binary entry only wires xtask-core's run to this workspace's module-rule and impl-model checks."

# Foundation checks start disabled for existing packages; new packages are checked automatically.

[state_fields]
skip = ["kivact", "kivact-core", "kivact-public-api-tests", "kivact-runtime", "kivact-i18n", "kivact-style", "kivact-interaction", "kivact-ui", "kivact-ui-basic", "kivact-ui-pop", "kivact-ui-game", "kivact-ui-creative", "kivact-ui-soft", "kivact-engine", "kivact-editing", "kivact-layout", "kivact-docs", "kivact-template-basic", "kivact-example-counter", "kivact-example-form", "kivact-example-list", "kivact-example-async", "kivact-example-component", "kivact-ui-basic-catalog", "kivact-ui-pop-catalog", "kivact-ui-game-catalog", "kivact-ui-creative-catalog", "kivact-ui-soft-catalog", "arvane", "kivact-types", "arvane-native", "arvane-shell", "arvane-virtual", "arvane-text", "arvane-render", "arvane-asset", "kivact-gpu-share", "gpu-interop-producer", "xtask"]
role_suffixes = ["Options", "Event", "Phase", "Reason", "Input", "Report", "Tokens", "Recipes"]
record_types = ["ListItem", "MenuEntry", "Command", "TreeNode", "DataColumn", "ToastOptions", "CalendarOptions", "StepperItem"]
value_modules = ["kivact-engine::contract", "kivact-types::semantics", "kivact-types::env", "kivact-types::layout", "kivact-types::paint", "kivact-types::text", "kivact-types::scene", "kivact-types::render", "kivact-types::input", "kivact-types::platform", "kivact-types::embed", "kivact-types::check"]

[effect_writes]
skip = ["kivact", "kivact-core", "kivact-public-api-tests", "kivact-runtime", "kivact-i18n", "kivact-style", "kivact-interaction", "kivact-ui", "kivact-ui-basic", "kivact-ui-pop", "kivact-ui-game", "kivact-ui-creative", "kivact-ui-soft", "kivact-engine", "kivact-editing", "kivact-layout", "kivact-docs", "kivact-template-basic", "kivact-example-counter", "kivact-example-form", "kivact-example-list", "kivact-example-async", "kivact-example-component", "kivact-ui-basic-catalog", "kivact-ui-pop-catalog", "kivact-ui-game-catalog", "kivact-ui-creative-catalog", "kivact-ui-soft-catalog", "arvane", "kivact-types", "arvane-native", "arvane-shell", "arvane-virtual", "arvane-text", "arvane-render", "arvane-asset", "kivact-gpu-share", "gpu-interop-producer", "xtask"]

[api_shape]
skip = ["kivact", "kivact-core", "kivact-public-api-tests", "kivact-runtime", "kivact-i18n", "kivact-style", "kivact-interaction", "kivact-ui", "kivact-ui-basic", "kivact-ui-pop", "kivact-ui-game", "kivact-ui-creative", "kivact-ui-soft", "kivact-engine", "kivact-editing", "kivact-layout", "kivact-docs", "kivact-template-basic", "kivact-example-counter", "kivact-example-form", "kivact-example-list", "kivact-example-async", "kivact-example-component", "kivact-ui-basic-catalog", "kivact-ui-pop-catalog", "kivact-ui-game-catalog", "kivact-ui-creative-catalog", "kivact-ui-soft-catalog", "arvane", "kivact-types", "arvane-native", "arvane-shell", "arvane-virtual", "arvane-text", "arvane-render", "arvane-asset", "kivact-gpu-share", "gpu-interop-producer", "xtask"]

[canonical_path]
