# `cargo xtask check`（xtask-core）が読む workspace の規則（CONTRIBUTING.md）。

output = "architecture"

[limits]
# 1ファイルの code 行の上限。空行・comment だけの行・文字列 literal の中だけの行は数えない。
max_code_lines = 1000

[diagrams]
targets = "lib-bin"

[visible_to]
# dev-dependency は visible_to の対象外（dev/xtask の core_filters.rs。設計 6.3）。

# ----- Shader validation: naga is confined to kivact-shader, which style (kivact-style) uses.
kivact-shader = ["kivact-style"]

# ----- SVG export: the SVG 1.1 writer and its PNG encoding are confined to kivact-svg, which kivact-offscreen (Offscreen::render_svg) uses.
kivact-svg = ["kivact-offscreen"]
# ----- Windowless rendering: a leaf the facade re-exports as kivact::draw::Offscreen.
kivact-offscreen = ["kivact"]
kivact-macros = ["kivact", "kivact-ui", "kivact-interaction"]

# ----- Kivact の内部 crate: host を知らない反応の核は kivact-core だけが使う。アプリと部品は
# kivact facade だけに依存する。
kivact-runtime = ["kivact-style", "kivact-i18n", "kivact-core", "kivact-test", "kivact-offscreen"]
kivact-i18n = ["kivact-core", "kivact-test"]
kivact-style = ["kivact-core", "kivact-test", "kivact-offscreen"]
kivact-core = ["kivact", "kivact-interaction", "kivact-ui", "kivact-test"]
kivact-test = ["kivact"]
kivact-interaction = ["kivact", "kivact-ui"]
kivact-ui = ["kivact"]
kivact-devtools-protocol = ["kivact-devtools-agent", "kivact-core", "kivact-devtools", "kivact-devtools-mcp"]
kivact-devtools-agent = ["kivact-core"]

# ----- Core/engine boundary: only kivact-core consumes the engine.
# App::run, OffscreenRenderer and the test driver share the engine API.
# Embedded handles are Send + Sync. A panic of an embedded App is kept as a
# message in a PanicSlot and reported to the embedder (`Embedded::status`);
# Kivact never resumes it on the embedder's thread.
# Detach facts use the single process-wide tracker in kivact-types.
# Only arvane-native retains the code module; task and asset contain no unsafe.
# Shared values belong to kivact-types; pure layout belongs to kivact-layout.
kivact-engine = ["kivact-core", "kivact-test", "kivact-offscreen"]
# Editing transports resolved line paints and document decorations; authored StyledRange/TextDecoration belong to style.
kivact-editing = ["kivact-style", "kivact-engine", "kivact-core"]
kivact-layout = ["kivact-engine"]

# ----- Arvane: 窓口の arvane は engine と lower が使う。adapter 同士は
# arvane-shell の語彙と入力正規化、kivact-types の値を共有する。
arvane = ["kivact-engine"]
# GPU texture 共有の中立な kivact-gpu-share は UI を知らず、import と export の契約を共有する
# （visible_to は書かない。誰でも依存できる）。
arvane-shell = ["arvane", "arvane-native", "kivact-engine", "arvane-virtual"]
# Linux embedded native services own XCB/XIM, AT-SPI and desktop services;
# callbacks queue through arvane-shell and never depend back on the engine.
arvane-native = ["kivact-engine", "arvane-virtual", "kivact"]
# Engine testing owns the stepped Script/Probe bridge; core uses its public test host.
arvane-virtual = ["kivact-engine", "kivact-test"]
arvane-text = ["arvane", "kivact", "arvane-asset", "kivact-engine"]
arvane-render = ["arvane", "arvane-compose", "kivact-engine"]
# The compositor plan: Composition to draw operations, owned by the window (arvane) and the facade (kivact).
arvane-compose = ["arvane", "kivact", "kivact-engine"]
arvane-asset = ["arvane", "kivact-engine"]
# ----- The frame protocol: the engine builds it and the Arvane crates consume it.
arvane-protocol = ["arvane", "arvane-shell", "arvane-native", "arvane-virtual", "arvane-text", "arvane-render", "arvane-compose", "kivact-engine"]
# 試験だけの engine（自前の device で frame を描いて共有する）。dev-dependency だけが使う（dev-dependency は visible_to の対象外）。
gpu-interop-producer = []
catalog-shell = ["kivact-ui-basic-catalog", "kivact-ui-pop-catalog", "kivact-ui-game-catalog", "kivact-ui-creative-catalog", "kivact-ui-soft-catalog"]
kivact-plot = ["kivact-ui-basic", "kivact-ui-basic-catalog", "kivact-docs"]

# xtask-core は、外部 crate の glob import（`use kivact::prelude::*` など）がある module で、
# macro と derive の提供元を決められない。標準の macro と derive は glob で上書きされない前提で信頼する。
# 全 crate の循環と未解決 local path は error とし、移行中の警告扱いは設けない。
[analysis]
all_features = true
trusted_macros = [
    "assert", "assert_eq", "assert_ne", "cfg", "debug_assert", "debug_assert_eq",
    "debug_assert_ne", "eprintln", "format", "include_bytes", "include_str", "line",
    "concat", "matches", "panic", "println", "unreachable", "vec", "write", "writeln", "env", "file",
    "thread_local", "tracing::debug", "tracing::error", "tracing::info", "tracing::trace",
    "tracing::warn", "quote", "format_ident",
    # kivact-macros の proc-macro の入口（parse_macro_input・parse_quote）。展開の token は解析の外。
    "syn::parse_macro_input", "syn::parse_quote",
    # workspace の macro_rules と、それを呼ぶ path は dev/xtask（macros.rs）が自動で足す。
    # item を生成する macro は、呼んだ module を解析の外に置く。
]
trusted_attributes = ["serde", "component"]
# #[component] fn が作る Type（`fn button` が `Button`）を、その fn の隣に宣言する。
generated_type_attributes = ["component"]
trusted_derives = [
    "Clone", "Copy", "Debug", "Default", "Eq", "Hash", "Ord", "PartialEq", "PartialOrd",
    "Deserialize", "Serialize",
    # kivact-macros の `#[derive(Prop)]`。impl IntoValue<T> for T だけを作り、module の参照を足さない。
    "Prop", "kivact::Prop",
]

# ----- crate 内の module の依存の向き（dev/xtask の module_rules.rs）。依存の向き
# `kivact-runtime ◀ i18n ◀ style ◀ view, draw ◀
# custom ◀ test` と `{task, motion, style, view} ◀ platform, diagnostics, gpu_interop ◀
# client` を書く。`uses` の key の module（子孫を含む）は、自分の部分木、crate root、
# 値に挙げた module、`uses` に無い module だけを参照してよい。`except` は上向きの例外
# "from -> to"（`crate::` を省く。from はその module だけ、to はその module と子孫）。どの参照にも
# 使われない例外も error にする。
[module_rules.kivact-core]
# Canonical facades reexport owner access; the motion boundary adapter accepts the public NodeRef handle.
# visibility needs the window size, as the viewport element does (the node's visibility is read against the window).
except = ["style -> view::boundary", "state -> view::boundary", "state -> view::owner", "view::elements::viewport -> platform::env", "view::node_ref_visibility -> platform::env", "view::elements::viewport -> gpu_interop"]

[module_rules.kivact-core.uses]
state = []
geometry = []
task = []
motion = []
style = []
sync = []
view = ["task", "motion", "style", "state", "geometry", "sync"]
draw = ["task", "motion", "style"]
# env・service の要求・`why`・GPU の取り込みは、公開 module が実装を持つ（view の state と requests の上に立つ）。
platform = ["task", "motion", "style", "view"]
# Embedded App setup uses the same root client factory.
embed = ["state", "view", "launch", "app"]
diagnostics = ["task", "motion", "style", "view"]
# 実験 feature `gpu-interop`。per-App の状態は client が runtime の extension に入れる。
gpu_interop = ["task", "motion", "style", "view", "sync"]
client = ["task", "motion", "style", "view", "platform", "gpu_interop", "diagnostics"]
# Launch owns client construction; App and embedding consume that shared boundary.
launch = ["state", "view", "platform", "diagnostics", "gpu_interop", "client", "devtools", "geometry"]
app = ["state", "view", "launch", "geometry", "platform"]
custom = ["task", "motion", "style", "view", "draw"]
devtools = ["task", "motion", "style", "state", "geometry", "sync", "view", "platform", "diagnostics", "client"]

# kivact-i18n contains pure locale values and ICU formatting calculations.
[module_rules.kivact-i18n.uses]
date = ["locale"]
format = ["date"]
interpolate = []
locale = []
messages = ["format"]
numbers = ["format", "locale"]
regional = ["date", "format", "locale", "numbers"]

[module_rules.kivact-runtime.uses]
machine = ["reactive", "task"]
host = ["reactive", "task", "motion"]
reactive = []
task = ["reactive"]
motion = ["reactive"]

# kivact-style の module。値（`asset`・`length`・`geometry`・`color`・`transform`・`path`・`grid`・`icon`）を
# 下に、それを使う `theme`・`effect`・`paint`・`text` をその上に、`Draw` の `draw`、`Style` の `sheet`、
# `Style` 全体の `resolve` をさらに上に置く。
[module_rules.kivact-style.uses]
asset = []
# The theme-aware length resolution sits below geometry and paint.
length = ["theme"]
geometry = ["length"]
color = []
transform = ["geometry", "length"]
path = ["geometry", "transform"]
grid = ["length"]
icon = ["asset"]
theme = ["color", "icon"]
effect = ["asset", "color", "geometry", "length", "path", "shader", "theme"]
paint = ["asset", "color", "geometry", "length", "shader", "theme"]
shader = ["asset", "color", "geometry", "paint", "theme"]
text = ["color", "effect", "paint", "theme"]
draw = ["asset", "color", "effect", "geometry", "length", "paint", "path", "shader", "text", "theme", "transform"]
sheet = ["color", "draw", "effect", "geometry", "grid", "length", "paint", "text", "theme", "transform"]
resolve = [
    "color", "draw", "effect", "geometry", "grid", "length", "paint", "sheet", "text", "theme",
    "transform",
]

# kivact-interaction は部品ごとに、組み合わせてよい下位の部品を書く。純粋な計算の `policy` と、
# `disclosure`・`list`・`drag`・`edit` などの部品の上に、`popup`・`menu`・`select`・`table`・
# `palette` を組む。表に無い部品を参照するときは、ここに足してから使う。
[module_rules.kivact-interaction.uses]
policy = []
axis = []
press = []
delayed = []
space_pan = []
disclosure = []
edit = []
focus_return = []
roving = []
drag = ["edit"]
list = ["axis", "roving"]
text_edit = ["edit"]
toaster = []
toggle = ["edit"]
popup = ["disclosure", "focus_return"]
scalar = ["axis", "drag", "edit", "focus_return", "policy"]
range_scalar = ["drag", "edit", "policy", "scalar"]
dialog = ["focus_return", "popup"]
tooltip = ["delayed", "popup"]
combobox = ["list", "surface"]
surface = ["focus_return", "popup"]
tabs = ["axis", "edit", "list"]
tree = ["list", "press"]
select = ["edit", "focus_return", "list", "popup", "surface"]
menu = ["delayed", "focus_return", "list", "popup"]
zoom_pan = ["edit", "space_pan"]
splitter = ["axis", "drag", "edit", "policy", "press", "scalar"]
table = ["axis", "list", "policy", "roving", "splitter"]
palette = ["combobox", "dialog", "list", "popup"]

# Portable shell vocabulary and input normalization never depend on a backend.
[module_rules.arvane-shell.uses]
pipeline = ["events", "types", "ime"]
a11y = ["events"]
types = []
events = ["types"]
clicks = ["events"]
contacts = ["events"]
mouse = []
ime = []
services = []
# The window SPI uses the neutral vocabulary and the GPU target leaf.
window = ["events", "ime", "types", "services", "a11y", "target", "input"]
target = []
# Injected input is pipeline vocabulary; one window's normalization joins its parts.
input = ["pipeline"]
window_input = ["events", "types", "ime", "pipeline", "mouse", "clicks", "contacts", "input"]


# B7: topology below measurement, Model processing, presentation,
# diagnostics and host. model::interact belongs to the Model processing tier.
[module_rules.arvane-compose.uses]
cache = []
plan = ["cache"]
tables = []
cpu = ["plan", "cache", "tables"]
gpu = ["plan", "cache", "tables"]

[module_rules.kivact-engine]
except = [
    # Model owns passive state; these leaves import no Model or processing code.
    "model::aggregate -> paint::state",
    "model::aggregate -> a11y::state",
    "model::aggregate -> check::lint::state",
]
[module_rules.kivact-engine.uses]
lower = []
text_input = []
contract = []
tree = ["lower", "contract"]
mutation = ["contract", "tree"]
frame_log = ["contract"]
measure = ["text_input", "lower", "contract", "tree"]
layer = ["lower"]
model = ["text_input", "lower", "contract", "tree", "measure", "mutation", "layer"]
text_measure = ["lower", "contract", "tree", "measure", "model"]
paint = ["lower", "contract", "tree", "measure", "mutation", "model", "text_measure", "offscreen", "layer"]
a11y = ["contract", "tree", "measure", "mutation", "model"]
check = ["lower", "contract", "tree", "measure", "mutation", "model", "paint", "a11y"]
host = ["text_input", "contract", "tree", "measure", "mutation", "model", "paint", "a11y", "check", "text_measure", "frame_log", "offscreen", "lower"]
offscreen = ["lower", "contract", "text_measure"]
# The facade exposes the immutable WriteStats DTO from this passive leaf.
api = ["contract", "host", "offscreen", "text_measure", "mutation"]
embed = ["contract", "host", "api", "frame_log"]
testing = ["contract", "host", "offscreen", "api"]

# Shared values and render records depend only on the concept modules below.
# Closure-owning contracts stay in the engine; backend implementations stay outside types.
[module_rules.kivact-types.uses]
animatable = ["geometry"]
color_space = ["color"]
effect = ["asset", "color", "geometry", "pixel"]
asset = []
cell = []
check = ["geometry", "ids", "semantics"]
color = []
defaults = ["geometry"]
embed = ["defaults", "geometry", "gpu"]
env = ["cell", "defaults", "geometry"]
geometry = []
geometry3d = ["geometry"]
gpu = []
gradient_stops = ["color", "color_space", "geometry", "paint"]
ids = []
input = ["geometry"]
# Length is the authoring type layout and paint are built from.
layout = ["geometry", "ids", "length", "motion", "semantics"]
length = ["theme_var"]
motion = ["animatable", "geometry"]
# Length is the authoring type layout and paint are built from.
paint = ["asset", "color", "color_space", "effect", "geometry", "geometry3d", "layout", "length", "motion", "pixel", "scene", "style_state"]
platform = ["asset", "geometry"]
process = []
pixel = ["asset", "color"]
export = ["ids", "pixel"]
shaped = ["color", "geometry", "semantics_text", "text"]
scene = ["asset", "color", "effect", "geometry", "geometry3d", "gpu", "ids", "paint", "pixel", "semantics", "shaped", "text"]
semantics = ["geometry", "ids", "semantics_text"]
semantics_text = ["geometry", "ids"]
style_state = []
text =["color", "color_space", "geometry", "paint"]
text_shaping = ["scene", "shaped", "text"]
text_utf = []
theme_var = []
type_map = []

[style]
enabled = true
extra_rules = [
    "glob-imports",
    "non-leaf-implementation",
    "rustfmt-skip",
    "catch-unwind",
    "poison-access",
    "options-default",
]
# 公開 API はまだ大きく変わるので、公開 item の rustdoc の有無（missing-docs）は今は検査しない。
# API が落ち着いたら外す。
disabled_rules = ["missing-docs"]
# non-exhaustive（extra_rules に入れていない）も同じ理由で今は検査しない。互換を残さない初期開発版では
# semver の利点がなく、workspace の中の match から網羅性の検査を奪うだけになる。API が落ち着いたら
# extra_rules に戻す。下の api_packages はそのときの対象。
# Shared vocabulary is defined in kivact-types concept modules; render records are internal transport.
# facade（kivact）から届く crate と、五つの公式キット。
api_packages = [
    "kivact", "kivact-test", "kivact-core", "kivact-editing", "kivact-gpu-share", "kivact-i18n", "kivact-interaction",
    "kivact-runtime", "kivact-style", "kivact-types", "kivact-ui",
    "kivact-ui-basic", "kivact-ui-creative", "kivact-ui-game", "kivact-ui-pop", "kivact-ui-soft", "kivact-plot",
]
# 関数に渡す「option の束」。必須の値（親 window、texture の大きさ）は束に入れず引数で渡す。
options_structs = [
    "arvane-native::mirror::MirrorWindowOptions",
    "arvane-virtual::VirtualOptions",
    "arvane::DriverOptions",
    "arvane-shell::ChildHooks",
    "kivact-test::RenderOptions",
    "kivact-engine::api::HostOptions",
    "kivact-engine::testing::TestHostOptions",
    "kivact-interaction::Delays",
    "kivact-interaction::DismissOn",
    "kivact-interaction::ListOptions",
    "kivact-interaction::ListRangeOptions",
    "kivact-interaction::TooltipTiming",
    "kivact-style::draw::ImageOptions",
    "kivact-style::draw::TextFormat",
    "kivact-types::GpuPreference",
    "kivact-types::embed::EmbedOptions",
    "kivact-types::env::PointerSettings",
    "kivact-types::platform::FileDialog",
    "kivact-ui-basic::ChartConfig",
    "kivact-ui-creative::ToolWindowOptions",
]


[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-core/src/style.rs"
reason = "The facade forwards only kivact_style::facade, an explicitly curated app vocabulary owned by kivact-style. Its single definition avoids a duplicate cross-crate export list; the implementation crate root and hidden backend bridge are never glob-exported."

# kivact::prelude は意図した公開 API（利用者が `use kivact::prelude::*;` で始める）。
# 利用者の立場のコード（例・雛形・公開 API とキットの E2E）だけが prelude を glob で読む。
# これらの path でも prelude 以外の glob は書かない。
[[style.exceptions]]
rule = "glob-imports"
path = "examples/*"
reason = "Examples are written as Kivact users write apps: they start from `use kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "templates/*"
reason = "The app template starts from `use kivact::prelude::*`, as the guides teach."

[[style.exceptions]]
rule = "glob-imports"
path = "dev/tests/kivact-public-api/*"
reason = "Public API E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "dev/tests/kivact-kit-tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "dev/bench/src/bin/*"
reason = "The bench binaries are measurement programs written from the user's side and start from `use kivact::prelude::*`."

[[style.exceptions]]
rule = "poison-access"
path = "crates/arvane-asset/src/svg/fonts.rs"
reason = "The locked value is a pure cache of immutable font data. Recovering a poisoned guard cannot expose a half-updated value, and the asset worker must keep parsing after an unrelated panic."

[[style.exceptions]]
rule = "poison-access"
path = "crates/arvane-native/src/port/embed/child.rs"
reason = "The child's command queue and applied values are plain data. The lock is taken on the host's thread and in the platform's window procedure, where unwrapping a poisoned guard would panic outside the panic boundary and unwind into the host (ADR-68)."

[[style.exceptions]]
rule = "poison-access"
path = "crates/arvane-native/src/port/x11/thread.rs"
reason = "The X11 UI thread's join-handle slot is plain data (the handle and its state). Its lock is taken on the host's thread in open, close and collect_panic, where unwrapping a poisoned guard would panic outside the panic boundary and unwind into the host (ADR-68)."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-macros/src/lib.rs"
item = "component"
reason = "The proc-macro entry is the crate's only export; the parsing and expansion live in the child modules."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-macros/src/lib.rs"
item = "derive_prop"
reason = "The proc-macro entry is the crate's only export; the parsing and expansion live in the child modules."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-basic/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-plot/tests/*"
reason = "Plot E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-creative/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-game/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-pop/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-devtools/*"
reason = "The DevTools app is written as a Kivact user writes an app (dogfooding P-07): it starts from `use kivact::prelude::*`."

[[style.exceptions]]
rule = "catch-unwind"
path = "crates/arvane-native/src/port/win32/proc.rs"
item = "port::win32::proc::wndproc"
reason = "Defense in depth at a foreign frame: Win32 calls this subclassed window procedure from the embedding host's message loop, so a panic must not unwind into it. The whole shutdown (state.stop, Session::close, handler close/drop, root disposal) runs inside this boundary. The payload's message is kept in the child's PanicSlot, the App stops without running more App code, and `Embedded::status` reports it; it is never resumed into the host and never swallowed."

[[style.exceptions]]
rule = "catch-unwind"
path = "crates/arvane-native/src/port/x11/thread.rs"
item = "port::x11::thread::run"
reason = "Defense in depth at the X11 UI thread's own boundary: the App's start, event loop and shutdown run inside it, so a panic is kept in the child's PanicSlot and the session forgets the App instead of closing or dropping it. The payload is never resumed on this thread, and `Embedded::status` reports it through `ChildStop::Panicked`."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/arvane-native/src/port/x11/test_parent.rs"
reason = "Test-only X11 host: the module owns one large TestParent implementation plus its query leaf; splitting every top-level helper into a leaf would scatter one test host's state without making an ownership boundary."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "examples/kivact-ui-basic/src/docs.rs"
item = "docs::pages"
reason = "Glue: the page registry only lists each child page module's `page()` in navigation order."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "dev/xtask/src/main.rs"
item = "main"
reason = "Glue: the binary entry only wires xtask-core's run to this workspace's module-rule and impl-model checks."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-devtools-mcp/src/main.rs"
item = "main"
reason = "Glue: the MCP binary entry only reads the embedded schema and starts the stdio server."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-devtools/tests/app.rs"
reason = "Glue: the integration test root registers the shared support module and the per-panel test modules, then holds the shell tests."


[kit_literal_color]
allowed_files = ["tokens.rs", "theme.rs", "color.rs"]

[os_branch]
allowed_paths = ["crates/arvane-native/", "crates/kivact-gpu-share/", "crates/arvane-render/src/gpu/", "crates/arvane-compose/src/gpu/", "crates/kivact-types/src/gpu.rs", "crates/arvane-asset/", "crates/arvane-text/"]

[ui_machine]
# kivact-ui に残す表示だけの timer（UI-04）。付属書 U が module を移したら、この path を同じ unit で直す。
allowed_types = ["kivact_ui::alert::view::BannerMachine", "kivact_ui::button::view::BusyInput", "kivact_ui::calendar::navigation::FocusSnapshot", "kivact_ui::empty_state::changes::Controller", "kivact_ui::progress::view::ProgressMotionInput"]

[hand_element]
# kivact-core の view の外で手書きの impl Element / impl IntoView を許す組（"<定義の path> <file>"）。
# trigger に付いて surface を兄弟で出す builder と、型付きの項目・panel を積む builder。root が一つの #[component] にできない（設計 5.1）。手書きのまま残す理由は 5 つの型：(1) trigger と surface を兄弟で出す（Tooltip・Dialog・HoverCard・Disclosure・Menu・Select・Combobox・NavigationMenu）、(2) surface を show で開くたびに作り直す（Dialog・HoverCard・Menu・Select・CommandPalette）、(3) 型付きの項目・panel を積む（DisclosureGroup・NavigationMenu）、(4) 呼出し側の press を包む（NavigationMenuLink）、(5) 型引数や複数の値を一組で受ける mode を持つ builder（DataTable。group_by・tree・sticky_columns・page・remote_page などを一組ずつ受ける。1 prop 1 setter に分けると組の片方だけの状態ができるため）、ItemRow（position(index, count) が index と count を一組で受ける）。
allowed_impls = [
  "kivact_ui::tooltip::view::Tooltip crates/kivact-ui/src/tooltip/view.rs",
  "kivact_ui::dialog::view::Dialog crates/kivact-ui/src/dialog/view.rs",
  "kivact_ui::hover_card::view::HoverCard crates/kivact-ui/src/hover_card/view.rs",
  "kivact_ui::disclosure::view::Disclosure crates/kivact-ui/src/disclosure/view.rs",
  "kivact_ui::disclosure::group::DisclosureGroup crates/kivact-ui/src/disclosure/group.rs",
  "kivact_ui::menu::view::Menu crates/kivact-ui/src/menu/view.rs",
  "kivact_ui::select::view::Select crates/kivact-ui/src/select/view.rs",
  "kivact_ui::combobox::handle::Combobox crates/kivact-ui/src/combobox/handle.rs",
  "kivact_ui::command_palette::view::CommandPalette crates/kivact-ui/src/command_palette/view.rs",
  "kivact_ui::navigation_menu::view::NavigationMenu crates/kivact-ui/src/navigation_menu/view.rs",
  "kivact_ui::navigation_menu::link::NavigationMenuLink crates/kivact-ui/src/navigation_menu/link.rs",
  "kivact_ui::data_table::builder::DataTable crates/kivact-ui/src/data_table/builder.rs",
  "kivact_ui::data_table::runtime::DataTable crates/kivact-ui/src/data_table/runtime.rs",
  "kivact_ui::item_list::row::ItemRow crates/kivact-ui/src/item_list/row.rs",
  "kivact_ui::date_input::view::DateInput crates/kivact-ui/src/date_input/view.rs",
  "kivact_ui::date_range_input::view::DateRangeInput crates/kivact-ui/src/date_range_input/view.rs",
  "kivact_ui_basic::native_select::NativeSelect crates/kivact-ui-basic/src/native_select.rs",
  # 理由 (5)：generic の setter `menu<C, R>` を持つ builder（DataTable と同じ扱い。設計者の回答 (B4)）。
  "kivact_ui_creative::dock::view::Dock crates/kivact-ui-creative/src/dock/view.rs",
  # 理由 (1)：trigger と surface を兄弟で出す builder（soft の more_menu・power_search・top_nav の TopNavMegaMenu。設計者の回答、2026-11-22）。
  "kivact_ui_soft::more_menu::MoreMenu crates/kivact-ui-soft/src/more_menu.rs",
  "kivact_ui_soft::power_search::PowerSearch crates/kivact-ui-soft/src/power_search.rs",
  "kivact_ui_soft::top_nav::TopNavMegaMenu crates/kivact-ui-soft/src/top_nav.rs",
  # 理由 (2)：中に中核の Dialog を持ち、surface を開くたびに作る builder（soft の alert_dialog。設計者の回答、2026-11-22）。
  "kivact_ui_soft::alert_dialog::AlertDialog crates/kivact-ui-soft/src/alert_dialog.rs",
  # 理由 (1)：trigger の上に置く field の builder（catalog の IconInput。字句どおり node_mut は中の TextInput の node を返す。設計者の回答 (B)-3）。
  "kivact_ui_pop_catalog::pages::forms::IconInput examples/kivact-ui-pop/src/pages/forms.rs",
]

[module_rules.arvane-virtual.uses]
clock = []
script = ["clock"]
surface = []
window = ["clock", "script", "surface"]
backend = ["clock", "script", "surface", "window"]
mirror = ["surface", "window"]

[module_rules.arvane-native.uses]
port = ["present", "a11y", "services", "display"]
present = []
a11y = []
services = []
display = []
mirror = ["port", "present", "a11y"]

