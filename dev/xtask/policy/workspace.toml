# `cargo xtask check`（xtask-core）が読む workspace の規則（CONTRIBUTING.md）。

output = "architecture"

[limits]
# 1ファイルの code 行の上限。空行・comment だけの行・文字列 literal の中だけの行は数えない。
max_code_lines = 1000

[diagrams]
targets = "lib-bin"

[visible_to]

# ----- Kivact の内部 crate: host を知らない反応の核は kivact-core だけが使う。アプリと部品は
# kivact facade だけに依存する。
kivact-reactive = ["kivact-task", "kivact-i18n", "kivact-motion", "kivact-style", "kivact-core"]
kivact-i18n = ["kivact-core"]
kivact-task = ["kivact-core"]
kivact-motion = ["kivact-style", "kivact-core"]
kivact-style = ["kivact-core"]
kivact-core = ["kivact", "kivact-interaction", "kivact-ui"]
kivact-interaction = ["kivact", "kivact-ui"]
kivact-ui = ["kivact"]

# ----- Core/engine boundary: only kivact-core consumes the engine.
# App::run, Offscreen and the test driver share this bridge.
# Embedded handles are Send + Sync. A panic of an embedded App is kept in a
# PanicSlot and resumed by the embedder's next call; nothing turns it into a
# diagnostic.
# Detach facts flow task -> core and asset/native -> arvane -> engine/embed.
# Only arvane-native retains the code module; task and asset contain no unsafe.
# Shared values belong to kivact-wire; pure layout belongs to kivact-layout.
kivact-engine = ["kivact-core"]
kivact-editing = ["kivact-style", "kivact-wire", "kivact-text", "kivact-engine", "kivact-core"]
kivact-wire = ["kivact-lower", "kivact-layout", "kivact-engine", "kivact-motion", "kivact-style", "kivact-core"]
kivact-lower = ["kivact-text", "kivact-engine"]
kivact-text = ["kivact-engine"]
kivact-layout = ["kivact-engine"]

# ----- Arvane: 窓口の arvane は engine と lower が使う。adapter 同士は
# arvane-shell の語彙と入力正規化、kivact-types の値を共有する。
arvane = ["kivact-lower", "kivact-text", "kivact-engine"]
# GPU texture 共有の中立な kivact-gpu-share は UI を知らず、import と export の契約を共有する
# （visible_to は書かない。誰でも依存できる）。
kivact-types = [
    "arvane*", "kivact-editing", "kivact-wire", "kivact-lower", "kivact-text", "kivact-engine", "kivact-reactive", "kivact-gpu-share", "gpu-interop-producer",
]
arvane-shell = ["arvane", "arvane-native"]
# Linux embedded native services own XCB/XIM, AT-SPI and desktop services;
# callbacks queue through arvane-shell and never depend back on the engine.
arvane-native = ["arvane"]
arvane-text = ["arvane"]
arvane-render = ["arvane"]
arvane-asset = ["arvane"]
# 試験だけの engine（自前の device で frame を描いて共有する）。Arvane の契約の試験と、公開 API の試験・
# creative kit の GPU frame の試験（dev-dependency）だけが使う。
gpu-interop-producer = ["arvane", "kivact-public-api-tests", "kivact-ui-creative"]

# ----- アプリ・例・雛形・ツール: 誰も依存しない。
kivact-template-basic = []
kivact-example-counter = []
kivact-example-form = []
kivact-example-list = []
kivact-example-async = []
kivact-example-component = []
kivact-ui-basic-catalog = []
kivact-ui-pop-catalog = []
kivact-ui-game-catalog = []
kivact-ui-creative-catalog = []
kivact-docs = []
# Public API tests consume all four official kits for theme conformance.
kivact-public-api-tests = []
xtask = []

# xtask-core は、外部 crate の glob import（`use kivact::prelude::*` など）がある module で、
# macro と derive の提供元を決められない。標準の macro と derive は glob で上書きされない前提で信頼する。
# 全 crate の循環と未解決 local path は error とし、移行中の警告扱いは設けない。
[analysis]
all_features = true
trusted_macros = [
    "assert", "assert_eq", "assert_ne", "cfg", "debug_assert", "debug_assert_eq",
    "debug_assert_ne", "eprintln", "format", "include_bytes", "include_str", "line",
    "concat", "matches", "panic", "println", "unreachable", "vec", "write", "writeln", "env", "file",
    "thread_local", "tracing::debug", "tracing::error", "tracing::info", "tracing::trace",
    "tracing::warn",
    # workspace の macro_rules と、それを呼ぶ path は dev/xtask（macros.rs）が自動で足す。
    # item を生成する macro は、呼んだ module を解析の外に置く。
]
trusted_derives = [
    "Clone", "Copy", "Debug", "Default", "Eq", "Hash", "Ord", "PartialEq", "PartialOrd",
    "Deserialize", "Serialize",
]

# ----- crate 内の module の依存の向き（dev/xtask の module_rules.rs）。依存の向き
# `kivact-reactive ◀ task, motion, i18n ◀ style ◀ view, draw ◀ control ◀
# primitive ◀ prelude ◀ test` と `{task, motion, style, view} ◀ platform, diagnostics, gpu_interop ◀
# client ◀ prelude` を書く。`uses` の key の module（子孫を含む）は、自分の部分木、crate root、
# 値に挙げた module、`uses` に無い module だけを参照してよい。`except` は上向きの例外
# "from -> to"（`crate::` を省く。from はその module だけ、to はその module と子孫）。どの参照にも
# 使われない例外も error にする。
[module_rules.kivact-core.uses]
task = []
motion = []
style = []
view = ["task", "motion", "style"]
draw = ["task", "motion", "style"]
control = ["task", "motion", "style", "view"]
# env・service の要求・`why`・GPU の取り込みは、公開 module が実装を持つ（view の state と requests の上に立つ）。
platform = ["task", "motion", "style", "view"]
# Embedded App setup uses the same root client factory.
embed = ["view"]
diagnostics = ["task", "motion", "style", "view"]
# 実験 feature `gpu-interop`。per-App の状態は client が runtime の extension に入れる。
gpu_interop = ["task", "motion", "style", "view"]
client = ["task", "motion", "style", "view", "platform", "gpu_interop"]
primitive = ["task", "motion", "style", "view", "draw", "control"]
# 再公開だけの入口。中核の module からは参照させない（test だけが使う）。
prelude = [
    "task", "motion", "style", "view", "draw", "control", "platform",
    "diagnostics", "client", "primitive",
]
test = [
    "task", "motion", "style", "view", "draw", "control", "platform",
    "diagnostics", "gpu_interop", "client", "primitive", "prelude", "embed",
]

# kivact-i18n の module。`context` は locale と messages の値を読む。
[module_rules.kivact-i18n.uses]
date = ["locale"]
locale = []
messages = []
context = ["locale", "messages"]

# kivact-motion の module。`values` は補間する値と frame の型、`state` は frame loop と animation を
# App ごとに束ねる。`animated` と `frame_loop` は `state` の上に立つ。
[module_rules.kivact-motion.uses]
values = []
state = ["values"]
transition = ["values"]
frame_loop = ["state", "values"]
animated = ["state", "transition", "values"]

# kivact-style の module。値（`asset`・`length`・`geometry`・`color`・`transform`・`path`・`grid`・`icon`）を
# 下に、それを使う `theme`・`effect`・`paint`・`text` をその上に、`Draw` の `draw`、`Style` の `sheet`、
# `Style` 全体の `resolve` をさらに上に置く。
[module_rules.kivact-style.uses]
asset = []
length = []
geometry = ["length"]
color = []
transform = ["geometry", "length"]
path = ["geometry", "transform"]
grid = ["length"]
icon = ["asset"]
theme = ["color", "icon"]
effect = ["color", "geometry", "length", "path", "theme"]
paint = ["asset", "color", "geometry", "length", "theme"]
text = ["color", "effect", "paint", "theme"]
draw = ["asset", "color", "effect", "geometry", "paint", "path", "text", "theme", "transform"]
sheet = ["color", "draw", "effect", "geometry", "grid", "length", "paint", "text", "theme", "transform"]
resolve = [
    "color", "draw", "effect", "geometry", "grid", "length", "paint", "sheet", "text", "theme",
    "transform",
]

# kivact-interaction は部品ごとに、組み合わせてよい下位の部品を書く。純粋な計算の `policy` と、
# `disclosure`・`list`・`drag`・`edit` などの部品の上に、`popup`・`menu`・`select`・`table`・
# `palette` を組む。表に無い部品を参照するときは、ここに足してから使う。
[module_rules.kivact-interaction.uses]
policy = []
disclosure = []
edit = []
focus_return = []
roving = []
drag = ["edit"]
list = ["roving"]
text_edit = []
toaster = []
toggle = []
popup = ["disclosure", "focus_return"]
scalar = ["drag", "edit", "focus_return", "policy"]
range_scalar = ["drag", "edit", "policy", "scalar"]
dialog = ["focus_return", "popup"]
tooltip = ["disclosure", "popup"]
combobox = ["list"]
tabs = ["list"]
tree = ["list"]
select = ["focus_return", "list", "popup"]
menu = ["disclosure", "focus_return", "list", "popup"]
zoom_pan = ["edit"]
splitter = ["drag", "edit", "policy", "scalar"]
table = ["list", "policy", "roving", "splitter"]
palette = ["combobox", "dialog", "list", "popup"]

# Portable shell vocabulary and input normalization never depend on a backend.
[module_rules.arvane-shell.uses]
a11y = ["events"]
types = []
events = []
clicks = ["events"]
contacts = ["events"]
mouse = []
ime = []
services = []
# The window SPI uses the neutral vocabulary and the GPU target leaf.
window = ["events", "ime", "types", "services", "a11y", "target"]
target = []


# B7: topology below measurement, Model processing, presentation,
# diagnostics and host. model::interact belongs to the Model processing tier.
[module_rules.kivact-engine]
except = [
    # Model owns passive state; these leaves import no Model or processing code.
    "model::aggregate -> paint::state",
    "model::aggregate -> a11y::state",
    "model::aggregate -> check::lint::state",
    # Sync derives Look values directly and calls PaintState's narrow invalidator.
    "model::interact::sync -> paint::state",
]
[module_rules.kivact-engine.uses]
tree = []
mutation = []
frame_log = []
measure = ["tree"]
model = ["tree", "measure", "mutation"]
layout = ["tree"]
text_measure = ["tree", "measure", "model"]
paint = ["tree", "measure", "mutation", "model", "text_measure"]
a11y = ["tree", "measure", "mutation", "model"]
check = ["tree", "measure", "mutation", "model", "paint", "a11y"]
host = ["tree", "measure", "mutation", "model", "paint", "a11y", "check", "text_measure", "frame_log"]
offscreen = ["text_measure"]
# The facade exposes the immutable WriteStats DTO from this passive leaf.
bridge = ["host", "offscreen", "text_measure", "mutation"]
native = ["host", "offscreen", "bridge"]

# kivact-types: 語彙（root の module）は host と Arvane の protocol に依存しない。`protocol` を key にして
# 語彙の全 module を許すのは、protocol から語彙への向きだけを許す（`protocol` が key でないと、語彙から
# protocol への参照は検査されない）ため。
[module_rules.kivact-types.uses]
asset = []
cursor = []
effect = []
geometry = []
gpu_interop = []
image = []
input = []
layout = []
motion = []
paint = []
platform = ["input"]
semantics = []
semantics_text = ["geometry"]
shape = []
style = []
text = ["geometry"]
protocol = [
    "asset", "cursor", "effect", "geometry", "gpu_interop", "image", "input", "layout", "motion",
    "paint", "platform", "semantics", "semantics_text", "shape", "style", "text",
]

# ----- Google Rust Style Guide の機械的に検査できる部分（vendor/xtask-core の README「Style checks」）。
# 例外は Google の指針自体が認める場合（意図した prelude、FFI の境界の defense in depth など）だけに書き、
# reason にその設計上の事実を書く。件数を減らすための例外は書かない。
[style]
enabled = true
extra_rules = [
    "glob-imports",
    "non-leaf-implementation",
    "rustfmt-skip",
    "non-exhaustive",
    "catch-unwind",
    "poison-access",
    "options-default",
]
# 公開 API はまだ大きく変わるので、公開 item の rustdoc の有無（missing-docs）は今は検査しない。
# API が落ち着いたら外す。
disabled_rules = ["missing-docs"]
# 語彙と protocol: facade が再公開する値は kivact-types の protocol 外で定義する。kivact-wire と kivact_types::protocol は workspace 内の protocol。
# facade（kivact）から届く crate と、四つの公式キット。
api_packages = [
    "kivact", "kivact-core", "kivact-editing", "kivact-gpu-share", "kivact-i18n", "kivact-interaction",
    "kivact-motion", "kivact-reactive", "kivact-style", "kivact-task", "kivact-types", "kivact-ui",
    "kivact-ui-basic", "kivact-ui-creative", "kivact-ui-game", "kivact-ui-pop", "kivact-wire",
]
# 関数に渡す「option の束」。必須の値（親 window、texture の大きさ）は束に入れず引数で渡す。
options_structs = [
    "arvane::embed::EmbedOptions",
    "arvane::test_display::VirtualWindowOptions",
    "arvane-native::test_display::TestWindowOptions",
    "arvane-shell::ChildOptions",
    "arvane-shell::ShellOptions",
    "kivact-core::platform::FileDialog",
    "kivact-core::test::RenderOptions",
    "kivact-engine::HostOptions",
    "kivact-engine::embed::EmbedOptions",
    "kivact-engine::testing::TestHostOptions",
    "kivact-interaction::Dismiss",
    "kivact-interaction::ListPolicy",
    "kivact-interaction::ListRangePolicy",
    "kivact-interaction::TooltipConfig",
    "kivact-style::draw::ImageOptions",
    "kivact-style::draw::TextStyle",
    "kivact-types::GpuPreference",
    "kivact-types::protocol::MouseSettings",
    "kivact-ui-basic::ChartConfig",
    "kivact-ui-creative::WindowOptions",
]

# kivact::prelude は意図した公開 API（利用者が `use kivact::prelude::*;` で始める）。
# 利用者の立場のコード（例・雛形・公開 API とキットの E2E）だけが prelude を glob で読む。
# これらの path でも prelude 以外の glob は書かない。
[[style.exceptions]]
rule = "glob-imports"
path = "examples/*"
reason = "Examples are written as Kivact users write apps: they start from `use kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "templates/*"
reason = "The app template starts from `use kivact::prelude::*`, as the guides teach."

[[style.exceptions]]
rule = "glob-imports"
path = "dev/tests/kivact-public-api/*"
reason = "Public API E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-basic/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-creative/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-game/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact-ui-pop/tests/*"
reason = "Kit E2E tests are written from the user's side and import `kivact::prelude::*`."

[[style.exceptions]]
rule = "glob-imports"
path = "crates/kivact/src/prelude.rs"
reason = "The facade prelude is kivact_core's prelude plus the standard UI functions."

[[style.exceptions]]
rule = "catch-unwind"
path = "crates/arvane-native/src/embed/windows/proc.rs"
item = "embed::windows::proc::wndproc"
reason = "Defense in depth at a foreign frame: Win32 calls this subclassed window procedure from the embedding host's message loop, so a panic must not unwind into it. The payload is kept in the child's PanicSlot, the App stops without running more App code, and the host's next call on Embedded resumes it (resume_unwind); it is never swallowed."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-core/src/client/dispatch.rs"
item = "client::dispatch::dispatch"
reason = "Glue that ties the event modules together: it routes each HostEvent variant to the child module of its kind and implements no event handling itself."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-core/src/view/mount.rs"
item = "view::mount::mount_host_with"
reason = "Glue that ties the mounting stages together: it runs the child modules' stages in the one order mounting requires and implements none of them."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/kivact-core/src/view/mount.rs"
item = "view::mount::mount_host"
reason = "The stage sequence of mount_host_with without a layout fix-up; glue over the mounting stages."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "crates/arvane-native/src/embed.rs"
item = "embed::open"
reason = "Glue: `open` only selects the Win32 or X11 child backend by cfg; other platforms report Unsupported."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "examples/kivact-ui-basic/src/docs.rs"
item = "docs::PAGES"
reason = "Glue: the page registry only lists each child page module's `page()` in navigation order."

[[style.exceptions]]
rule = "non-leaf-implementation"
path = "dev/xtask/src/main.rs"
item = "main"
reason = "Glue: the binary entry only wires xtask-core's run to this workspace's module-rule and impl-model checks."

# ----- non-exhaustive: workspace protocol（利用者は名前を書かない。作る側と match する側は同時に変える）。
[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-wire/src/*"
reason = "kivact-wire is the client/host protocol of the workspace (visible_to: lower, layout, engine, motion, style, core) and defines no facade-reachable value; facade-visible values are kivact-types vocabulary it re-exports. Its consumers build its values field by field and match them exhaustively."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-types/src/protocol/*"
reason = "kivact_types::protocol holds the values only the engine and Arvane exchange (scenes, shaped text, semantics trees, window input); the facade re-exports none, and Arvane matches every draw command, paint and shape exhaustively."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-reactive/src/keyed.rs"
reason = "Keyed-row diff contract between kivact-reactive and kivact-core's for_each and canvas regions; not re-exported by the facade, and kivact-core acts on every Diff and Plan variant."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-reactive/src/data.rs"
item = "data::Kind"
reason = "Graph-node kind of the runtime's diagnostics snapshot, read only by kivact-core's why(), which handles every kind; not re-exported by the facade."

# ----- non-exhaustive: 集合が標準や幾何で決まっていて、増えない enum。
[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-core/src/view/boundary.rs"
item = "view::boundary::ReadingDirection"
reason = "A base text direction is left-to-right or right-to-left (Unicode bidi); vertical writing would be a different type."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-i18n/src/locale.rs"
item = "locale::Weekday"
reason = "The seven days of the week; the set never changes."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-interaction/src/dialog.rs"
item = "dialog::Side"
reason = "The four physical sides of the window; a logical side would be a separate type resolved against the reading direction."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-interaction/src/range_scalar.rs"
item = "range_scalar::RangeThumb"
reason = "A range has exactly a low and a high thumb."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-interaction/src/toggle.rs"
item = "toggle::CheckedState"
reason = "The tri-state of aria-checked (false, true, mixed); the set is fixed by WAI-ARIA."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-types/src/semantics.rs"
item = "semantics::LiveRegion"
reason = "The values of aria-live (off, polite, assertive); fixed by WAI-ARIA."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-types/src/semantics.rs"
item = "semantics::SortDirection"
reason = "The values of aria-sort (none, ascending, descending, other); fixed by WAI-ARIA."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-types/src/semantics.rs"
item = "semantics::Orientation"
reason = "The values of aria-orientation (undefined, horizontal, vertical); fixed by WAI-ARIA."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-types/src/shape.rs"
item = "shape::FillRule"
reason = "The two winding rules of SVG and Canvas (nonzero, evenodd); the set never changes."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-types/src/shape.rs"
item = "shape::LineCap"
reason = "The three line caps of SVG and Canvas (butt, round, square); the set never changes."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-ui-basic/src/sidebar/state.rs"
item = "sidebar::state::SidebarSide"
reason = "A sidebar sits on the left or the right edge; the set never changes."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-ui-creative/src/dock/model.rs"
item = "dock::model::DockAxis"
reason = "A split is horizontal or vertical; a 2D layout has no third axis."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-ui-creative/src/dock/model.rs"
item = "dock::model::DockSide"
reason = "The four edges of a dock container; the set never changes."

# ----- non-exhaustive: `..X::default()` で組み立てる option / token の束（FRU）。
[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-core/src/platform/services.rs"
item = "platform::services::FileDialog"
reason = "Options struct users build with FRU (`..FileDialog::default()`)."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-core/src/test/options.rs"
item = "test::options::RenderOptions"
reason = "Options struct users build with FRU (`..RenderOptions::from_env()` or `..RenderOptions::default()`)."

[[style.exceptions]]
rule = "non-exhaustive"
path = "crates/kivact-gpu-share/src/pool.rs"
item = "pool::PoolConfig"
